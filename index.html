<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills-For-Good — Give what you know</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232620;
  --ink-soft:#4B4A3F;
  --paper:#FAF8F3;
  --paper-raised:#FFFFFF;
  --primary:#1E5C4F;
  --primary-soft:#28715F;
  --primary-wash:#E7EFEA;
  --marigold:#D98A2E;
  --marigold-wash:#FBEEDC;
  --line:#E6E2D6;
  --line-soft:#EFECE3;
  --muted:#8A8371;
  --danger:#B5493F;
  --danger-wash:#F5E2DF;
  --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
.font-mono{ font-family:'IBM Plex Mono', monospace; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
::selection{ background:var(--marigold-wash); }

#app{ min-height:100vh; display:flex; flex-direction:column; }
.topnav{ position:sticky; top:0; z-index:50; background:var(--paper-raised); border-bottom:1px solid var(--line); }
.topnav-inner{ max-width:1140px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; letter-spacing:-0.01em; color:var(--ink); }
.brand-mark{ width:26px; height:26px; border-radius:6px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; }
.nav-links{ display:flex; gap:2px; align-items:center; }
.nav-links button{ color:var(--ink-soft); font-size:14px; font-weight:500; padding:9px 13px; border-radius:6px; transition:all .15s; }
.nav-links button:hover{ color:var(--ink); background:var(--line-soft); }
.nav-links button.active{ color:var(--primary); background:var(--primary-wash); font-weight:600; }
.nav-cta{ background:var(--primary) !important; color:#fff !important; padding:9px 16px !important; border-radius:6px; font-weight:600 !important; margin-left:6px; }
.nav-cta:hover{ background:var(--primary-soft) !important; }

.page{ flex:1; }
.container{ max-width:1140px; margin:0 auto; padding:0 24px; }
.container-narrow{ max-width:720px; margin:0 auto; padding:0 24px; }

footer{ border-top:1px solid var(--line); padding:26px 24px; margin-top:64px; }
footer .container{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.footer-note{ font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:8px; font-size:14.5px; font-weight:600; transition:all .15s; white-space:nowrap; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-soft); }
.btn-accent{ background:var(--marigold); color:#241505; }
.btn-accent:hover{ background:#C67A24; }
.btn-outline{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
.btn-outline:hover{ background:var(--primary-wash); }
.btn-ghost{ background:transparent; color:var(--ink-soft); }
.btn-ghost:hover{ color:var(--ink); }
.btn-sm{ padding:9px 15px; font-size:13.5px; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }

.card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:26px; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.08em; font-size:11px; color:var(--primary); font-weight:600; }
.eyebrow.warm{ color:var(--marigold); }
.eyebrow.mut{ color:var(--muted); }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:100px; }
.badge-verified{ background:var(--primary-wash); color:var(--primary); }
.badge-pending{ background:var(--marigold-wash); color:#8C5A14; }
.badge-neutral{ background:var(--line-soft); color:var(--ink-soft); }
.badge-danger{ background:var(--danger-wash); color:var(--danger); }
.chip{ display:inline-flex; padding:5px 12px; border-radius:100px; font-size:13px; background:var(--primary-wash); color:var(--primary); font-weight:500; }
.divider{ height:1px; background:var(--line); border:none; margin:24px 0; }
.hr-dash{ border:none; border-top:1.5px dashed var(--line); margin:20px 0; }

textarea, input[type=text], input[type=number], input[type=tel], select{
  width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:13px 14px;
  border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); transition:border .15s;
}
textarea:focus, input:focus, select:focus{ outline:none; border-color:var(--primary); }
label.field-label{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:7px; }

.hero{ padding:72px 0 56px; }
.hero-eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.07em; text-transform:uppercase; color:var(--primary); font-weight:600; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
.hero-eyebrow::before{ content:''; width:20px; height:1.5px; background:var(--primary); }
.hero h1{ font-weight:800; font-size:clamp(34px,4.6vw,52px); line-height:1.12; letter-spacing:-0.02em; max-width:760px; color:var(--ink); }
.hero h1 span{ color:var(--primary); }
.hero p.lede{ font-size:17.5px; color:var(--ink-soft); max-width:560px; margin-top:20px; line-height:1.65; }
.hero-actions{ display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }

.split-cards{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:60px; }
.side-card{ border:1.5px solid var(--line); border-radius:12px; padding:28px; background:var(--paper-raised); transition:border-color .15s, transform .15s; cursor:pointer; }
.side-card:hover{ border-color:var(--primary); transform:translateY(-2px); }
.side-card .num{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted); }
.side-card h3{ font-size:23px; margin:10px 0 10px; color:var(--ink); font-weight:700; letter-spacing:-0.01em; }
.side-card p{ color:var(--ink-soft); font-size:14.5px; margin-bottom:16px; }

.stat-strip{ display:flex; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-top:52px; }
.stat-strip .stat{ flex:1; padding:22px 26px; border-right:1px solid var(--line); }
.stat-strip .stat:last-child{ border-right:none; }
.stat .stat-num{ font-size:27px; font-weight:800; color:var(--primary); letter-spacing:-0.01em; }
.stat .stat-label{ font-size:12px; color:var(--muted); margin-top:4px; font-family:'IBM Plex Mono',monospace; }

.section{ padding:56px 0; }
.section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px; gap:20px; flex-wrap:wrap; }
.section-head h2{ font-size:27px; color:var(--ink); font-weight:700; letter-spacing:-0.01em; }
.section-head p{ color:var(--muted); font-size:14.5px; max-width:440px; }

.flow-steps{ display:grid; grid-template-columns:repeat(5,1fr); gap:0; position:relative; }
.flow-step{ padding:18px 18px 0; position:relative; }
.flow-step .fs-line{ height:2px; background:var(--line); position:relative; margin-bottom:16px; }
.flow-step .fs-dot{ width:9px; height:9px; border-radius:50%; background:var(--primary); position:absolute; top:-3.5px; left:0; }
.flow-step h4{ font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:5px; }
.flow-step p{ font-size:12.5px; color:var(--muted); }

/* Stepper (Match -> Schedule -> Prepare -> Engage -> Feedback) */
.stage-stepper{ display:flex; align-items:center; margin:26px 0 40px; }
.stage-item{ display:flex; align-items:center; gap:9px; flex:1; }
.stage-item .sd{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'IBM Plex Mono',monospace; flex-shrink:0; }
.stage-item .sd.done{ background:var(--primary); color:#fff; }
.stage-item .sd.current{ background:var(--marigold); color:#241505; }
.stage-item .sd.pending{ background:var(--line-soft); color:var(--muted); }
.stage-item .sl{ font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
.stage-item .sl.on{ color:var(--ink); }
.stage-connector{ flex:1; height:1.5px; background:var(--line); margin:0 4px; }

.page-head{ padding:44px 0 8px; }
.page-head .eyebrow{ margin-bottom:12px; }
.page-head h1{ font-size:32px; color:var(--ink); font-weight:800; letter-spacing:-0.015em; }
.page-head p{ color:var(--muted); margin-top:10px; font-size:15px; max-width:560px; }

.step-track{ display:flex; gap:8px; margin:26px 0 40px; }
.step-track .st{ flex:1; height:3px; background:var(--line); border-radius:3px; overflow:hidden; }
.step-track .st.done, .step-track .st.current{ background:var(--marigold); }

.extract-anim{ display:flex; align-items:center; gap:10px; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:16px 0; }
.dot-flash{ width:6px; height:6px; border-radius:50%; background:var(--marigold); animation:flash 1s infinite; }
.dot-flash:nth-child(2){ animation-delay:.15s;} .dot-flash:nth-child(3){ animation-delay:.3s;}
@keyframes flash{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

.struct-card{ border:1.5px solid var(--primary); border-radius:10px; padding:22px; background:var(--primary-wash); }
.struct-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed rgba(30,92,79,0.18); font-size:14px; }
.struct-row:last-child{ border-bottom:none; }
.struct-row .k{ color:var(--primary); font-weight:600; font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
.struct-row .v{ color:var(--ink); font-weight:500; text-align:right; max-width:60%; }

.profile-head{ display:flex; gap:22px; align-items:flex-start; padding:40px 0 8px; flex-wrap:wrap; }
.avatar{ width:72px; height:72px; border-radius:14px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:25px; font-weight:700; flex-shrink:0; }
.profile-info h1{ font-size:27px; color:var(--ink); font-weight:800; letter-spacing:-0.01em; }
.profile-info .role{ color:var(--ink-soft); font-size:15px; margin-top:4px; }
.profile-info .meta-row{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); }

.ledger-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:26px 0; }
.ledger-cell{ background:var(--paper-raised); padding:20px; text-align:center; }
.ledger-cell .lc-num{ font-size:27px; font-weight:800; color:var(--marigold); }
.ledger-cell .lc-label{ font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:4px; }

.two-col{ display:grid; grid-template-columns:2fr 1fr; gap:22px; }
.skill-tag{ display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:100px; background:#fff; border:1px solid var(--line); font-size:13.5px; margin:0 8px 8px 0; }
.skill-tag .lvl{ width:6px; height:6px; border-radius:50%; background:var(--primary); }

.trust-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.trust-col .tc-head{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-family:'IBM Plex Mono',monospace; margin-bottom:10px; }
.trust-row{ display:flex; align-items:center; gap:8px; font-size:13.5px; padding:6px 0; }
.trust-mark{ width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; }
.trust-mark.v{ background:var(--primary); color:#fff; }
.trust-mark.s{ background:var(--line-soft); color:var(--muted); }

.verify-step{ display:flex; gap:14px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--line-soft); }
.verify-step:last-child{ border-bottom:none; }
.verify-num{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; font-family:'IBM Plex Mono',monospace; }
.verify-num.done{ background:var(--primary); color:#fff; }
.verify-num.current{ background:var(--marigold-wash); color:var(--marigold); border:1.5px solid var(--marigold); }
.verify-num.pending{ background:var(--line-soft); color:var(--muted); }
.verify-body{ flex:1; }
.verify-title{ font-weight:600; font-size:14.5px; }
.verify-desc{ font-size:13px; color:var(--muted); margin-top:2px; }

.match-card{ border:1.5px solid var(--line); border-radius:12px; padding:22px; margin-bottom:16px; background:var(--paper-raised); position:relative; transition:border-color .15s; }
.match-card.best{ border-color:var(--marigold); box-shadow:0 0 0 1px var(--marigold); }
.match-card.selected{ border-color:var(--primary); box-shadow:0 0 0 1.5px var(--primary); background:var(--primary-wash); }
.best-tag{ position:absolute; top:-11px; left:20px; background:var(--marigold); color:#241505; font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em; }
.match-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.match-reasons{ margin-top:14px; display:flex; flex-direction:column; gap:7px; }
.match-reason{ display:flex; gap:8px; font-size:13.5px; color:var(--ink-soft); align-items:flex-start; }
.match-reason .ck{ color:var(--primary); flex-shrink:0; font-weight:700; }
.considered-tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

/* Calendar / scheduling */
.cal-card{ border:1.5px solid var(--primary); border-radius:12px; overflow:hidden; margin-bottom:14px; background:#fff; }
.cal-head{ background:var(--primary-wash); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
.cal-head .ch-session{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--primary); font-family:'IBM Plex Mono',monospace; }
.cal-body{ padding:18px 20px; }
.cal-date-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
.cal-date-row .cd-day{ font-size:19px; font-weight:800; color:var(--ink); }
.cal-date-row .cd-time{ font-size:14px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
.cal-mode{ font-size:13px; color:var(--muted); margin-bottom:14px; }
.confirm-list{ display:flex; flex-direction:column; gap:8px; }
.confirm-item{ display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-soft); }
.confirm-item .cm{ color:var(--primary); font-weight:700; }
.gcal-btn{ display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-weight:600; color:var(--ink); margin-top:14px; }
.gcal-btn:hover{ border-color:var(--primary); }
.gcal-confirm{ margin-top:12px; padding:12px 14px; background:var(--primary-wash); border-radius:8px; font-size:13px; color:var(--primary); font-weight:600; display:flex; gap:8px; align-items:center; }

.passbook{ border:1.5px solid var(--primary); border-radius:14px; overflow:hidden; background:#fff; margin:26px 0; }
.passbook-head{ background:var(--primary); color:#fff; padding:20px 26px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.passbook-head .ph-title{ font-size:18px; font-weight:700; }
.passbook-head .ph-sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:rgba(255,255,255,0.7); margin-top:3px; }
.passbook-body{ padding:8px 0; }
.perf-edge{ height:8px; background:repeating-linear-gradient(to right, var(--paper) 0 6px, transparent 6px 12px); }

.timeline{ padding:22px 26px; }
.tl-item{ display:flex; gap:16px; padding-bottom:26px; position:relative; }
.tl-item:last-child{ padding-bottom:0; }
.tl-item::before{ content:''; position:absolute; left:13px; top:28px; bottom:0; width:1.5px; background:var(--line); }
.tl-item:last-child::before{ display:none; }
.tl-dot{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; z-index:1; }
.tl-dot.done{ background:var(--primary); color:#fff; }
.tl-dot.current{ background:var(--marigold); color:#241505; }
.tl-dot.pending{ background:var(--paper); border:1.5px solid var(--line); color:var(--muted); }
.tl-content{ flex:1; padding-top:2px; }
.tl-content .tl-title{ font-weight:600; font-size:14.5px; color:var(--ink); }
.tl-content .tl-date{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-top:2px; }
.tl-content .tl-desc{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; }

.task-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.task-item{ display:flex; align-items:center; gap:10px; font-size:13.5px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper-raised); }
.task-item.checked{ background:var(--primary-wash); border-color:var(--primary); }
.task-check{ width:16px; height:16px; border-radius:4px; border:1.5px solid var(--muted); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
.task-item.checked .task-check{ background:var(--primary); border-color:var(--primary); color:#fff; }
.task-item.checked span.tt{ text-decoration:line-through; color:var(--muted); }
.task-due{ font-size:11px; color:var(--marigold); font-family:'IBM Plex Mono',monospace; margin-left:auto; flex-shrink:0; }

.thread{ border:1px solid var(--line); border-radius:10px; background:#F1EEE5; padding:16px; max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.bubble{ max-width:78%; padding:10px 13px; border-radius:11px; font-size:13.5px; line-height:1.45; }
.bubble.them{ background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:3px; }
.bubble.us{ background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:3px; }
.bubble.sys{ align-self:center; background:transparent; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; }
.bubble .bt{ font-size:10px; opacity:.65; margin-top:4px; }

.integration-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; background:var(--paper-raised); }
.integration-row .ir-icon{ width:34px; height:34px; border-radius:8px; background:var(--primary-wash); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.integration-row .ir-text{ flex:1; }
.integration-row .ir-title{ font-size:13.5px; font-weight:600; }
.integration-row .ir-sub{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

.rating-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
.rating-row:last-child{ border-bottom:none; }
.stars{ display:flex; gap:5px; }
.star{ width:26px; height:26px; cursor:pointer; color:var(--line); transition:color .1s; }
.star.on{ color:var(--marigold); }

.toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:13px 22px; border-radius:8px; font-size:14px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:200; display:flex; align-items:center; gap:10px; animation:toastin .25s ease; }
@keyframes toastin{ from{ opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
.pill-select{ display:flex; gap:8px; flex-wrap:wrap; }
.pill-opt{ padding:9px 15px; border:1.5px solid var(--line); border-radius:100px; font-size:13.5px; font-weight:500; color:var(--ink-soft); }
.pill-opt.on{ border-color:var(--primary); background:var(--primary); color:#fff; }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.mut{ color:var(--muted); }
.mb-8{margin-bottom:8px;} .mb-12{margin-bottom:12px;} .mb-16{margin-bottom:16px;} .mb-24{margin-bottom:24px;} .mb-32{margin-bottom:32px;}
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mt-32{margin-top:32px;}
.flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; } .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.small{ font-size:13px; }
.tiny{ font-size:11.5px; }
.clickable-list-item{ padding:16px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, background .15s; background:var(--paper-raised); }

const MATCH_REASONS = {

    { vid:'v1', score:96, reasons:["12 years of hands-on Excel and analytics experience","Has previously run beginner-level training sessions","Available on Saturdays — matches the requested slot","Based in Bengaluru, comfortable running remote sessions"] },

function defaultMatchesFor(need){
  const key = need.structured.skill.toLowerCase();
  const scored = VOLUNTEERS.map(v=>{
    let score = 40 + Math.round(Math.random()*8);
    const hit = v.skills.find(s=>key.includes(s.name.toLowerCase().split(' ')[0]) || s.name.toLowerCase().includes(key.split(' ')[0]) || key.includes(s.name.toLowerCase()));
    if(hit){ score += 38; }
    if(v.interests.some(i=>i.toLowerCase().includes(NONPROFITS.find(n=>n.id===need.nonprofitId).cause.toLowerCase().slice(0,5)))) score += 6;
    return { vid:v.id, score:Math.min(score,97) };
  }).sort((a,b)=>b.score-a.score).slice(0,3);
  return scored.map((s,i)=>({ vid:s.vid, score:s.score, reasons: buildGenericReasons(VOLUNTEERS.find(v=>v.id===s.vid), need, i===0) }));
}
function buildGenericReasons(v, need, isBest){
  const r = [];
  const matchedSkill = v.skills.find(s=> need.structured.skill.toLowerCase().includes(s.name.toLowerCase().split(' ')[0]));
  if(matchedSkill) r.push(`Skilled in ${matchedSkill.name} (${matchedSkill.lvl.toLowerCase()} level)`);
  r.push(`${v.company.split(',')[1]?.trim() || 'Experienced'} professional — background fits this kind of request`);
  r.push(`Availability: ${v.availability}`);
  if(!isBest) r.push('A relevant fit, though a step behind the top match on session experience');
  return r;
}
function getMatches(need){ return MATCH_REASONS[need.id] || defaultMatchesFor(need); }

/* ---------------- Engagement builder ---------------- */
function nextSaturday(offsetWeeks){
  const d = new Date();
  d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7) + offsetWeeks*7);
  return d;
}
function fmtDate(d){ return d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' }); }

function buildEngagement(need, volunteer){
  const nonprofit = NONPROFITS.find(n=>n.id===need.nonprofitId);
  const sessionCount = need.structured.sessions;
  const sessionTitles = {
    1: ['Session'],
    2: ['Kickoff & scoping','Delivery & handover'],
    3: ['Kickoff & scoping','Build / working session','Review & handover'],
    4: ['Introduction','Core Skills','Applied Practice','Practical Project'],
  }[sessionCount] || Array.from({length:sessionCount}, (_,i)=>`Session ${i+1}`);

  const sessions = sessionTitles.map((title,i)=>{
    const d = nextSaturday(i);
    return {
      id:'s'+(i+1), title, dateObj:d, date:fmtDate(d), time:'10:00 – 12:00 IST', status: i===0 ? 'upcoming' : 'scheduled',
      volTasks:[ {t:'Confirm availability for the slot', done:i>0}, {t: i===0 ? 'Review the need brief' : 'Prepare materials for this session', done:false, dueDaysBefore:2} ],
      npTasks:[ {t:'Share team background with volunteer', done:i>0}, {t:'Set up the room / video link', done:false, dueDaysBefore:2} ],
    };
  });

  return {
    needId: need.id, nonprofit, volunteer, need, sessions,
    status:'scheduled',
    calendarCreated:true,
    reminders:[
      `Volunteer reminded 24 hrs before ${sessions[0].title}`,
      `${nonprofit.name} reminded to prepare participant list`,
    ],
    comms:[
      { from:'system', text:`Skills For Good has connected you both for "${need.structured.type}". This thread is only for this engagement.` , t:'now'},
      { from:'nonprofit', text:`Hi ${volunteer.name.split(' ')[0]}, thank you so much for offering your time! Looking forward to ${sessions[0].date}.`, t:'2m ago' },
      { from:'volunteer', text:`Happy to help, ${nonprofit.contact.split(',')[0]}! Could you share the group's current comfort level beforehand?`, t:'just now' },
    ],
    currentSessionIndex:0,
    completed:false,
    feedback:{ volunteerToNonprofit:null, nonprofitToVolunteer:null },
  };
}

/* Reusable stage stepper for the core journey */
function renderStageStepper(current){
  const stages = ['Match','Schedule','Prepare','Engage','Feedback'];
  const idx = stages.indexOf(current);
  return `<div class="stage-stepper">
    ${stages.map((s,i)=>{
      const cls = i<idx ? 'done' : i===idx ? 'current' : 'pending';
      const mark = i<idx ? '✓' : (i+1);
      const row = `<div class="stage-item"><div class="sd ${cls}">${mark}</div><span class="sl ${i<=idx?'on':''}">${s}</span></div>`;
      return i < stages.length-1 ? row + `<div class="stage-connector"></div>` : row;
    }).join('')}
  </div>`;
}

/* ---- Volunteer onboarding (bio -> verify -> review) ---- */
function extractSkillsFromBio(bio){
  const catalog = ['excel','analytics','presentations','digital marketing','marketing','design','figma','finance','financial model','budgeting','data analysis','sql','hr','hiring','legal','contracts','compliance','web development','social media','brand','fundraising'];
  const found = [];
  const lower = bio.toLowerCase();
  catalog.forEach(k=>{ if(lower.includes(k) && !found.some(f=>f.toLowerCase().includes(k))) found.push(k.replace(/\b\w/g, c=>c.toUpperCase())); });
  const yearsMatch = bio.match(/(\d+)\s*year/i);
  const years = yearsMatch ? yearsMatch[1] : '—';
  return {
    skills: found.length? found.slice(0,6) : ['Generalist'],
    experience: years + (years!=='—' ? ' years' : ''),
    seniority: (parseInt(years)||0) >= 10 ? 'Senior / Leadership level' : (parseInt(years)||0) >= 5 ? 'Mid-senior level' : 'Early-mid career',
  };
}

/* ---- Create need ---- */
function extractNeed(raw){
  const lower = raw.toLowerCase();
  let skill = 'General support';
  const skillMap = { excel:'MS Excel', fundrais:'Fundraising Strategy', website:'Web Development', data:'Data Analysis', marketing:'Digital Marketing', financial:'Financial Modelling', hr:'HR Process Design', hiring:'HR Process Design', 'social media':'Social Media Strategy', legal:'Legal / Compliance', brand:'Brand Strategy' };
  for(const k in skillMap){ if(lower.includes(k)){ skill = skillMap[k]; break; } }
  const sessMatch = raw.match(/(\d+)\s*session/i);
  const hourMatch = raw.match(/(\d+)\s*[- ]?hour/i);
  const peopleMatch = raw.match(/(\d+)[- ]?(person|people|member|team)/i);
  const sessions = sessMatch ? parseInt(sessMatch[1]) : (lower.includes('few weekend') || (lower.includes('weekends') && lower.includes('course')) ? 4 : 1);
  return {
    skill, type: sessions>1 ? 'Multi-session engagement' : 'Single session',
    duration: hourMatch ? `${hourMatch[1]} hours` + (sessions>1?` × ${sessions} sessions`:'') : (sessions>1? `${sessions} sessions`:'~2 hours'),
    participants: peopleMatch ? `${peopleMatch[1]} ${peopleMatch[2]}(s)` : '1–2 team members',
    format: sessions>1? `${sessions}-session engagement` : 'Single session',
    sessions,
  };
}

      </div>
    `).join('')}

    <button class="btn btn-accent btn-block mt-16" id="to-engagement-btn">Go to engagement dashboard →</button>
  </div>`;
}

/* ---- Engagement dashboard (the passbook) ---- */
function renderEngagement(){
  const needId = state.activeEngagementNeedId || state.params.needId;
  const eng = state.engagements[needId];
  if(!eng){ return `<div class="container-narrow mt-32"><p>No active engagement yet. <button class="btn btn-outline btn-sm" data-nav="browse-needs">Browse needs</button></p></div>`; }

  const curIdx = eng.currentSessionIndex;
  const totalSessions = eng.sessions.length;
  const allDone = eng.completed;

  return `<div class="container-narrow">
    ${renderStageStepper(allDone ? 'Feedback' : 'Prepare')}
    <div class="page-head" style="padding-top:0;">
      <div class="eyebrow">ENGAGEMENT ORCHESTRATION</div>
      <h1>${eng.need.structured.type}</h1>
      <p>${eng.nonprofit.name} × ${eng.volunteer.name} — Skills For Good is managing this engagement end to end.</p>
    </div>

    ${eng.fallbackNotice ? `<div class="struct-card mb-24" style="border-color:var(--danger); background:var(--danger-wash);">
      <div class="eyebrow" style="color:var(--danger)">FALLBACK LOGIC ACTIVATED</div>
      <p class="small mt-8" style="color:var(--ink)">${eng.fallbackNotice}</p>
    </div>` : ''}

    <div class="passbook">
      <div class="passbook-head">
        <div><div class="ph-title">Engagement Passbook</div><div class="ph-sub">${totalSessions} session${totalSessions>1?'s':''} · Status: ${allDone? 'COMPLETED' : eng.status.toUpperCase()}</div></div>
        <span class="badge ${allDone?'badge-verified':'badge-neutral'}">${allDone? '✓ Complete':'● In progress'}</span>
      </div>
      <div class="perf-edge"></div>
      <div class="timeline">
        <div class="tl-item"><div class="tl-dot done">✓</div><div class="tl-content"><div class="tl-title">Match accepted</div><div class="tl-date">${eng.volunteer.name} confirmed for this engagement</div></div></div>
        <div class="tl-item"><div class="tl-dot done">✓</div><div class="tl-content"><div class="tl-title">All sessions scheduled</div><div class="tl-desc">Google Calendar events created for both ${eng.nonprofit.contact.split(',')[0]} and ${eng.volunteer.name} (simulated).</div></div></div>
        ${eng.sessions.map((s,i)=>`
          <div class="tl-item">
            <div class="tl-dot ${i<curIdx || allDone ? 'done' : i===curIdx ? 'current':'pending'}">${i<curIdx||allDone?'✓':i+1}</div>
            <div class="tl-content">
              <div class="tl-title">${s.title}</div>
              <div class="tl-date">${s.date} · ${s.time}</div>
              ${i===curIdx && !allDone ? `<button class="btn btn-primary btn-sm mt-12" data-complete-session="${s.id}">Mark session complete →</button>` : ''}
            </div>
          </div>`).join('')}
        <div class="tl-item"><div class="tl-dot ${allDone?'done':'pending'}">${allDone?'✓':'★'}</div><div class="tl-content"><div class="tl-title">Feedback & reputation</div><div class="tl-desc">${allDone? 'Both sides can now leave feedback.' : 'Unlocks once all sessions are complete.'}</div></div></div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="card mb-16">
          <div class="eyebrow mb-12">PREPARATION — THIS SESSION</div>
          <div class="tiny mut mb-8">${eng.volunteer.name.split(' ')[0]}'s tasks</div>
          <div class="task-list mb-16">
            ${eng.sessions[curIdx] ? eng.sessions[curIdx].volTasks.map((t,i)=>`
              <div class="task-item ${t.done?'checked':''}" data-toggle-task="vol-${curIdx}-${i}">
                <span class="task-check">${t.done?'✓':''}</span><span class="tt">${t.t}</span>
                ${t.dueDaysBefore ? `<span class="task-due">DUE ${t.dueDaysBefore}D BEFORE</span>` : ''}
              </div>`).join('') : ''}
          </div>
          <div class="tiny mut mb-8">${eng.nonprofit.name.split(' ')[0]}'s tasks</div>
          <div class="task-list">
            ${eng.sessions[curIdx] ? eng.sessions[curIdx].npTasks.map((t,i)=>`
              <div class="task-item ${t.done?'checked':''}" data-toggle-task="np-${curIdx}-${i}">
                <span class="task-check">${t.done?'✓':''}</span><span class="tt">${t.t}</span>
                ${t.dueDaysBefore ? `<span class="task-due">DUE ${t.dueDaysBefore}D BEFORE</span>` : ''}
              </div>`).join('') : ''}
          </div>
        </div>

        <div class="card">
          <div class="eyebrow mb-12">SYSTEM ACTIVITY (SIMULATED)</div>
          <div class="integration-row"><div class="ir-icon">${icon('cal')}</div><div class="ir-text"><div class="ir-title">Google Calendar</div><div class="ir-sub">ALL ${totalSessions} EVENT${totalSessions>1?'S':''} CREATED</div></div><span class="badge badge-verified">Synced</span></div>
          <div class="integration-row"><div class="ir-icon">${icon('bell')}</div><div class="ir-text"><div class="ir-title">Reminders</div><div class="ir-sub">${eng.reminders.length} SENT AHEAD OF NEXT SESSION</div></div><span class="badge badge-neutral">Active</span></div>
          <div class="integration-row"><div class="ir-icon">${icon('wa')}</div><div class="ir-text"><div class="ir-title">WhatsApp bridge</div><div class="ir-sub">ENGAGEMENT THREAD OPEN BELOW</div></div><span class="badge badge-verified">Connected</span></div>
        </div>
      </div>

      <div>
        <div class="card mb-16">
          <div class="eyebrow mb-12">COMMUNICATION</div>
          <div class="thread">
            ${eng.comms.map(c=>`${c.from==='system' ? `<div class="bubble sys">${c.text}</div>` : `<div class="bubble ${c.from==='volunteer'?'us':'them'}">${c.text}<div class="bt">${c.t}</div></div>`}`).join('')}
          </div>
        </div>
        ${!allDone ? `<div class="card">
          <div class="eyebrow mb-12">FALLBACK SAFEGUARD</div>
          <p class="tiny mut mb-12">If ${eng.volunteer.name.split(' ')[0]} doesn't respond within 48 hrs, Skills For Good automatically activates the nonprofit's second-choice match, so the engagement never stalls.</p>
          <button class="btn btn-outline btn-sm btn-block" id="simulate-noresponse-btn">Simulate: volunteer doesn't respond →</button>
        </div>` : `<div class="card">
          <div class="eyebrow mb-12">NEXT STEP</div>
          <p class="small mb-12">All sessions are complete. Feedback unlocks the reputation layer for both sides.</p>
          <button class="btn btn-accent btn-block" data-nav="feedback" data-params='{"needId":"${needId}"}'>Leave feedback →</button>
        </div>`}
      </div>
    </div>
  </div>`;
}

/* ---- Feedback ---- */
function renderFeedback(){
  const needId = state.params.needId || state.activeEngagementNeedId;
  const eng = state.engagements[needId];
  if(!eng) return `<div class="container-narrow mt-32">No engagement selected.</div>`;
  const step = state.feedbackStep;
  const d = state.feedbackDraft;
  const dims = [['quality','Quality of the work / session'],['communication','Communication'],['reliability','Reliability & punctuality']];

  if(step==='done'){
    return `<div class="container-narrow">
      ${renderStageStepper('Feedback')}
      <div class="page-head" style="padding-top:0;"><div class="eyebrow">FEEDBACK COMPLETE</div><h1>Both sides have rated this engagement</h1><p>The volunteer's giving history has been updated.</p></div>
      <div class="card mb-16">
        <div class="eyebrow mb-12">${eng.volunteer.name}'s rating of ${eng.nonprofit.name}</div>
        ${dims.map(([k,l])=>`<div class="rating-row"><span class="small">${l}</span><span>${'★'.repeat(eng.feedback.volunteerToNonprofit[k])}${'☆'.repeat(5-eng.feedback.volunteerToNonprofit[k])}</span></div>`).join('')}
      </div>
      <div class="card mb-24">
        <div class="eyebrow mb-12">${eng.nonprofit.name}'s rating of ${eng.volunteer.name}</div>
        ${dims.map(([k,l])=>`<div class="rating-row"><span class="small">${l}</span><span>${'★'.repeat(eng.feedback.nonprofitToVolunteer[k])}${'☆'.repeat(5-eng.feedback.nonprofitToVolunteer[k])}</span></div>`).join('')}
      </div>
      <button class="btn btn-accent btn-block" data-nav="reputation" data-params='{"vid":"${eng.volunteer.id}"}'>View updated reputation profile →</button>
    </div>`;
  }

  const isVol = step==='volunteer';
  const ratee = isVol ? eng.nonprofit.name : eng.volunteer.name;
  const rater = isVol ? eng.volunteer.name : eng.nonprofit.contact.split(',')[0];

  return `<div class="container-narrow">
    ${renderStageStepper('Feedback')}
    <div class="page-head" style="padding-top:0;">
      <div class="eyebrow">TWO-SIDED FEEDBACK</div>
      <h1>${rater}, how did it go?</h1>
      <p>Rating ${ratee}. Independent from the other side's rating — neither sees the other's until both are submitted.</p>
    </div>
    <div class="card">
      ${dims.map(([k,l])=>`
        <div class="rating-row">
          <span class="small">${l}</span>
          <div class="stars" data-star-group="${k}">
            ${[1,2,3,4,5].map(n=>`<svg class="star ${d[k]>=n?'on':''}" data-star="${k}:${n}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`).join('')}
          </div>
        </div>
      `).join('')}
      <div class="rating-row">
        <span class="small">Engagement completed as planned?</span>
        <div class="pill-select">
          <div class="pill-opt ${d.completed? 'on':''}" data-completed="true">Yes</div>
          <div class="pill-opt ${!d.completed? 'on':''}" data-completed="false">No</div>
        </div>
      </div>
      <button class="btn btn-accent btn-block mt-24" id="submit-feedback-btn" ${(d.quality&&d.communication&&d.reliability)?'':'disabled'}>Submit feedback →</button>
    </div>
  </div>`;
}

/* ---- Reputation ---- */
function renderReputation(){
  const vid = state.params.vid || state.reputationVid || 'v1';
  const v = state.newVolunteer && state.newVolunteer.id===vid ? state.newVolunteer : VOLUNTEERS.find(x=>x.id===vid) || VOLUNTEERS[0];
  const history = Object.values(state.engagements).filter(e=>e.volunteer.id===v.id && e.completed);
  return `<div class="container-narrow">
    <div class="page-head">
      <div class="eyebrow">REPUTATION LAYER</div>
      <h1>${v.name}</h1>
      <p>${v.skills.slice(0,3).map(s=>s.name).join(' · ')}</p>
    </div>
    <div class="ledger-grid">
      <div class="ledger-cell"><div class="lc-num">${v.hoursGiven}</div><div class="lc-label">HOURS GIVEN</div></div>
      <div class="ledger-cell"><div class="lc-num">${v.projectsCompleted}</div><div class="lc-label">PROJECTS COMPLETED</div></div>
      <div class="ledger-cell"><div class="lc-num">${v.orgsHelped}</div><div class="lc-label">NONPROFITS HELPED</div></div>
      <div class="ledger-cell"><div class="lc-num">${v.rating}</div><div class="lc-label">AVG. RATING</div></div>
    </div>
    ${history.length ? `
    <div class="card mb-16">
      <div class="eyebrow mb-12">RECENTLY COMPLETED</div>
      ${history.map(e=>`
        <div class="flex justify-between items-center" style="padding:10px 0; border-bottom:1px solid var(--line);">
          <div><div style="font-weight:600; font-size:14px;">${e.need.structured.type} — ${e.nonprofit.name}</div><div class="tiny mut">${e.sessions.length} session${e.sessions.length>1?'s':''} · completed</div></div>
          <span>${'★'.repeat(e.feedback.nonprofitToVolunteer.quality)}</span>
        </div>
      `).join('')}
    </div>` : ''}
    <div class="card">
      <div class="eyebrow mb-12">GIVING HISTORY</div>
      <p class="small" style="color:var(--ink-soft)">Every completed engagement adds to this record — hours, causes and nonprofit feedback compound into a portable, verifiable reputation for generosity.</p>
      <div class="mt-16">${v.interests.map(i=>`<span class="chip" style="margin:0 8px 8px 0;">${i}</span>`).join('')}</div>
    </div>
  </div>`;
}

/* ---------------- Event wiring ---------------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const page = el.getAttribute('data-nav');
      const params = el.getAttribute('data-params');
      go(page, params? JSON.parse(params) : {});
    });
  });

  const extractBtn = document.getElementById('extract-btn');
  if(extractBtn) extractBtn.addEventListener('click', ()=>{
    state.onboardingBio = document.getElementById('bio-input').value;
    state.onboardingExtracting = true; state.onboardingExtracted=false; render();
    setTimeout(()=>{ state.onboardingExtracting=false; state.onboardingExtracted=true; render(); }, 1000);
  });
  const toVerifyBtn = document.getElementById('to-verify-btn');
  if(toVerifyBtn) toVerifyBtn.addEventListener('click', ()=>{ state.onboardingStep='verify'; render(); });

  const sendOtpBtn = document.getElementById('send-otp-btn');
  if(sendOtpBtn) sendOtpBtn.addEventListener('click', ()=>{
    state.verify.mobile = document.getElementById('mobile-input').value;
    state.verify.mobileSent = true; render();
    toast('OTP sent (simulated) ✓');
  });
  const verifyOtpBtn = document.getElementById('verify-otp-btn');
  if(verifyOtpBtn) verifyOtpBtn.addEventListener('click', ()=>{
    state.verify.mobileVerified = true; render();
    toast('Mobile number verified ✓');
  });
  const verifyEmailBtn = document.getElementById('verify-email-btn');
  if(verifyEmailBtn) verifyEmailBtn.addEventListener('click', ()=>{
    state.verify.email = document.getElementById('email-input').value;
    state.verify.emailVerifying = true; render();
    setTimeout(()=>{ state.verify.emailVerifying=false; state.verify.emailVerified=true; render(); toast('Professional identity verified ✓'); }, 1000);
  });
  const toReviewBtn = document.getElementById('to-review-btn');
  if(toReviewBtn) toReviewBtn.addEventListener('click', ()=>{ state.onboardingStep='review'; render(); });

  const saveBtn = document.getElementById('save-profile-btn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const ext = extractSkillsFromBio(state.onboardingBio);
    const loc = document.getElementById('loc-input').value;
    const avail = document.getElementById('avail-input').value;
    state.newVolunteer = { id:'v1', name:'Naveen Prashanth', initials:'NP', role:'Marketing Professional', company:ext.seniority+', '+ext.experience,
      location:loc, verified:true, skills:ext.skills.map(s=>({name:s,lvl:'Advanced'})), availability:avail, interests:['Education','Livelihoods'],
      bio: state.onboardingBio, hoursGiven:18, projectsCompleted:5, orgsHelped:4, rating:4.9 };
    toast('Profile created — verification complete ✓');
    go('volunteer-profile', {vid:'v1'});
  });

  const verifyRegBtn = document.getElementById('verify-reg-btn');
  if(verifyRegBtn) verifyRegBtn.addEventListener('click', ()=>{
    state.npVerify.regChecking = true; render();
    setTimeout(()=>{ state.npVerify.regChecking=false; state.npVerify.regVerified=true; render(); toast('Registration verified ✓'); }, 1000);
  });
  const verifyContactBtn = document.getElementById('verify-contact-btn');
  if(verifyContactBtn) verifyContactBtn.addEventListener('click', ()=>{
    state.npVerify.contactChecking = true; render();
    setTimeout(()=>{ state.npVerify.contactChecking=false; state.npVerify.contactVerified=true; render(); toast('Authorised contact verified ✓'); }, 1000);
  });

  const extractNeedBtn = document.getElementById('extract-need-btn');
  if(extractNeedBtn) extractNeedBtn.addEventListener('click', ()=>{
    state.needDraft.raw = document.getElementById('need-input').value;
    state.needExtracting = true; state.needExtracted = false; render();
    setTimeout(()=>{ state.needExtracting=false; state.needExtracted=true; render(); }, 1000);
  });
  const findMatchBtn = document.getElementById('find-match-btn');
  if(findMatchBtn) findMatchBtn.addEventListener('click', ()=>{ state.selectedMatchVid = null; go('matching', {needId:'q1'}); });

  document.querySelectorAll('[data-select-match]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.selectedMatchVid = el.getAttribute('data-select-match'); render(); });
  });
  const acceptBtn = document.getElementById('accept-match-btn');
  if(acceptBtn) acceptBtn.addEventListener('click', ()=>{
    const needId = acceptBtn.getAttribute('data-need');
    const need = NEEDS.find(q=>q.id===needId);
    const volunteer = state.newVolunteer && state.newVolunteer.id===state.selectedMatchVid ? state.newVolunteer : VOLUNTEERS.find(v=>v.id===state.selectedMatchVid);
    const eng = buildEngagement(need, volunteer);
    state.engagements[needId] = eng;
    state.activeEngagementNeedId = needId;
    state.gcalConfirmed = {};
    toast('Match accepted — creating calendar invites ✓');
    go('schedule', {needId});
  });

  document.querySelectorAll('[data-gcal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sid = el.getAttribute('data-gcal');
      state.gcalConfirmed[sid] = true;
      render();
    });
  });
  const toEngagementBtn = document.getElementById('to-engagement-btn');
  if(toEngagementBtn) toEngagementBtn.addEventListener('click', ()=>{ go('engagement', {needId: state.activeEngagementNeedId}); });

  document.querySelectorAll('[data-toggle-task]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [side, sIdx, tIdx] = el.getAttribute('data-toggle-task').split('-');
      const eng = state.engagements[state.activeEngagementNeedId];
      const list = side==='vol' ? eng.sessions[sIdx].volTasks : eng.sessions[sIdx].npTasks;
      list[tIdx].done = !list[tIdx].done;
      render();
    });
  });

  const completeBtn = document.querySelector('[data-complete-session]');
  if(completeBtn) completeBtn.addEventListener('click', ()=>{
    const sid = completeBtn.getAttribute('data-complete-session');
    const eng = state.engagements[state.activeEngagementNeedId];
    const idx = eng.sessions.findIndex(s=>s.id===sid);
    eng.sessions[idx].status='done';
    eng.comms.push({from:'system', text:`${eng.sessions[idx].title} marked complete.`, t:'now'});
    if(idx === eng.sessions.length-1){
      eng.completed = true; eng.status='completed';
      eng.comms.push({from:'nonprofit', text:`Thank you so much, ${eng.volunteer.name.split(' ')[0]}! This made a real difference for our team.`, t:'now'});
      toast('All sessions complete — feedback unlocked ✓');
    } else {
      eng.currentSessionIndex = idx+1;
      toast(`Session complete. Reminders sent ahead of "${eng.sessions[idx+1].title}" ✓`);
    }
    render();
  });

  const noResponseBtn = document.getElementById('simulate-noresponse-btn');
  if(noResponseBtn) noResponseBtn.addEventListener('click', ()=>{
    const eng = state.engagements[state.activeEngagementNeedId];
    const need = eng.need;
    const matches = getMatches(need);
    const second = matches[1];
    const secondVol = VOLUNTEERS.find(v=>v.id===second.vid);
    eng.volunteer = secondVol;
    eng.fallbackNotice = `The original volunteer did not respond within 48 hours. Skills For Good automatically activated the nonprofit's second-choice match — ${secondVol.name} — so the engagement continued without delay.`;
    eng.comms = [
      {from:'system', text:`Reassigned to ${secondVol.name} after no response from the original match.`, t:'now'},
      {from:'volunteer', text:`Hi, I'd be glad to help with this — looking forward to it!`, t:'just now'},
    ];
    toast('Second-choice volunteer activated automatically ✓');
    render();
  });

  document.querySelectorAll('[data-star]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [k,n] = el.getAttribute('data-star').split(':');
      state.feedbackDraft[k] = parseInt(n);
      render();
    });
  });
  document.querySelectorAll('[data-completed]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.feedbackDraft.completed = el.getAttribute('data-completed')==='true'; render(); });
  });
  const submitFbBtn = document.getElementById('submit-feedback-btn');
  if(submitFbBtn) submitFbBtn.addEventListener('click', ()=>{
    const needId = state.params.needId || state.activeEngagementNeedId;
    const eng = state.engagements[needId];
    const snapshot = {...state.feedbackDraft};
    if(state.feedbackStep==='volunteer'){
      eng.feedback.volunteerToNonprofit = snapshot;
      state.feedbackStep='nonprofit';
      state.feedbackDraft = { quality:0, communication:0, reliability:0, completed:true };
      toast('Feedback recorded — now the nonprofit rates the volunteer');
    } else {
      eng.feedback.nonprofitToVolunteer = snapshot;
      eng.volunteer.hoursGiven += eng.sessions.length * 2;
      eng.volunteer.projectsCompleted += 1;
      state.feedbackStep='done';
      toast('Reputation profile updated ✓');
    }
    render();
  });
}

render();
</script>
</body>
</html>
